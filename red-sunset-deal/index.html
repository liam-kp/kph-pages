<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Red Sunset - העסקה, צעד אחר צעד">
<meta property="og:description" content="וילה ראשונה לים, על קו החוף של סריטאנו">
<meta property="og:image" content="poster.jpg">
<title>Red Sunset - העסקה</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700&family=Heebo:wght@400;500&display=swap">
<style>
/* Layout: one centered column, video first; deliberately single dark look */
html{margin:0}
:root{--bg:#0b2b30;--fg:#eef4f3;--muted:#9fb9bb;--accent:#4fc2cc;--warn:#ff8a7a;--display:"Frank Ruhl Libre",Georgia,serif;--body:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);direction:rtl;margin:0}
main{max-width:1100px;margin:0 auto;padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.eb{font-size:12px;letter-spacing:.2em;color:var(--accent);direction:ltr;text-align:right;font-weight:500}
h1{font-family:var(--display);font-size:clamp(28px,5vw,44px);line-height:1.15;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:17px;margin:0;max-width:60ch;line-height:1.55}
video{width:100%;max-width:100%;aspect-ratio:16/9;background:#000;border-radius:8px;display:block}
</style>
</head>
<body>
<main>
  <div class="eb">RED SUNSET · HIN KONG · KOH PHANGAN</div>
  <h1>העסקה, צעד אחר צעד</h1>
  <p class="sub">וילה ראשונה לים, על קו החוף של סריטאנו. סרטון של כ-3 דקות - מה אתה שם, מה אתה מקבל, ואיך העסקה בנויה.</p>
  <video controls playsinline preload="metadata" poster="poster.jpg">
    <source src="redsunset.mp4" type="video/mp4">
  </video>
</main>
</body>
</html>
